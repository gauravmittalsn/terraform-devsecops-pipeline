name: Terraform CI-CD

on:
  push:
    branches:
      - feature/101
      - main

env:
  TF_VERSION: "1.9.8"
  WORKING_DIR: "./environment/dev"

  # Azure App Registration
  AZURE_CLIENT_ID: "7ddb2233-c46c-4e1d-96ba-5e9f18c9f60d"
  AZURE_CLIENT_SECRET: "T1i8Q~1riHPbHLrY6Tr~LeFKm5XB5Yr9jcs.3aWj"
  AZURE_TENANT_ID: "093e9319-5648-4618-8c7d-f585fb2ed3f9"
  AZURE_SUBSCRIPTION_ID: "2eeb0869-d474-4f94-a0b0-fb6a5d23d142"

permissions:
  contents: read

jobs:

  # =====================================================
  # FEATURE BRANCH
  # Init -> Fmt -> Validate -> Plan
  # =====================================================
  terraform-plan:

    name: Terraform Plan - Feature

    if: github.ref == 'refs/heads/feature/101'

    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ env.AZURE_CLIENT_ID }}
          client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      # Terraform Format
      - name: Terraform Format
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      # Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan


  # =====================================================
  # MAIN BRANCH
  # Init -> Fmt -> Validate -> Plan -> Apply
  # =====================================================
  terraform-apply:

    name: Terraform Plan and Apply - Main

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ env.AZURE_CLIENT_ID }}
          client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform Init
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      # Terraform Format
      - name: Terraform Format
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      # Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -out=tfplan

      # Terraform Apply
      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan